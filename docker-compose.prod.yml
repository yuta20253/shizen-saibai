version: "3.9"

services:
  nginx:
    image: yuta2025/shizen-nginx:${IMAGE_TAG:-latest}
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - rails
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - public_net
      - app_net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    command: >
      certonly --webroot
      -w /var/www/certbot
      -d zasso-lens.com
      -d www.zasso-lens.com
      --email ${LETSENCRYPT_EMAIL}
      --agree-tos
      --no-eff-email
    depends_on:
      - nginx
    profiles: ["cert"]

  # 証明書を自動更新する常駐サービス。
  # 12時間ごとに certbot renew を実行する（Let's Encrypt 推奨は1日2回）。
  # renew は冪等で、有効期限まで30日を切っていなければ何もしない。
  # 証明書が実際に更新されたときだけ --deploy-hook が発火し、
  # docker socket 経由で nginx コンテナに reload シグナルを送って新証明書を反映する。
  certbot-renew:
    image: certbot/certbot
    container_name: certbot-renew
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache docker-cli >/dev/null 2>&1 || true
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot \
            --deploy-hook "docker exec nginx nginx -s reload"
          sleep 12h & wait $${!}
        done
    depends_on:
      - nginx

  frontend:
    pids_limit: 200
    image: yuta2025/shizen-frontend:${IMAGE_TAG:-latest}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    container_name: frontend
    environment:
      NODE_ENV: production
    depends_on:
      - rails
    expose:
      - "3000"
    networks:
      - app_net

  rails:
    image: yuta2025/shizen-rails:${IMAGE_TAG:-latest}
    container_name: rails
    environment:
      RAILS_ENV: production

      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE}
      DATABASE_USERNAME: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}

      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY}
      CHATGPT_API_KEY: ${CHATGPT_API_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FRONTEND_URL: ${FRONTEND_URL}
    command: bash -c "./bin/rails db:create db:migrate && ./bin/rails s -b 0.0.0.0 -p 3000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - app_net

  db:
    image: mysql:8.0.32
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app_net

volumes:
  mysql_data:
  certbot_www:
  certbot_conf:

networks:
  public_net: {}
  app_net:
    internal: true
